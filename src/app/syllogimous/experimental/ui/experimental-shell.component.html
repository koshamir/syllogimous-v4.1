<a class="skip-link" href="#experimental-content">Перейти к содержимому</a>
<div class="experimental-shell">
    <header class="experimental-header">
        <div>
            <p class="eyebrow">Исследовательский режим</p>
            <h1>{{ copy.productName }}</h1>
        </div>
        <a routerLink="/start" class="legacy-link" aria-label="Вернуться в обычную игру">
            <span aria-hidden="true">←</span> {{ copy.back }}
        </a>
    </header>

    <nav class="experimental-nav" aria-label="Разделы экспериментального режима">
        <a routerLink="./" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ copy.overview }}</a>
        <a routerLink="setup" routerLinkActive="active">{{ copy.setup }}</a>
        <a routerLink="training" routerLinkActive="active">{{ copy.training }}</a>
        <a routerLink="assessment" routerLinkActive="active">{{ copy.assessment }}</a>
        <a routerLink="progress" routerLinkActive="active">{{ copy.progress }}</a>
        <a routerLink="settings" routerLinkActive="active">{{ copy.settings }}</a>
        <a routerLink="data" routerLinkActive="active">{{ copy.data }}</a>
    </nav>

    <main id="experimental-content" tabindex="-1">
        <router-outlet></router-outlet>
    </main>
</div>
