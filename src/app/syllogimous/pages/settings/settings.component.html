<app-card>
    <div body class="d-grid py-3 px-md-3" style="gap: 2rem;">
        <div class="card shadow-sm">
            <div class="card-header py-2 small">Настройки игры</div>
            <div class="card-body">
                <app-game-mode-choose></app-game-mode-choose>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header py-2 small">Таймер</div>
            <div class="card-body">
                <app-timer-choose></app-timer-choose>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header py-2 small">Доступность</div>
            <div class="card-body">
                <div class="d-grid" style="gap: 0.75rem;">
                    <app-input
                        type="select"
                        name="colorBlindnessMode"
                        label="Режим цветового восприятия"
                        placeholder="Режим цветового восприятия"
                        [ngControl]="colorBlindnessMode"
                        [options]="colorBlindnessChoices"
                    />
                    <p class="text-muted small">Меняет цвет <span class="is-negated">инверсии</span></p>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header py-2 small">Цели по времени</div>
            <div class="card-body">
                <div class="d-grid" style="gap: 0.75rem;">
                    <app-input
                        type="range"
                        min="15"
                        max="60"
                        step="5"
                        name="dailyProgressMinutes"
                        [label]="'Цель на день: ' + dailyProgressMinutes.value + ' мин'"
                        [ngControl]="dailyProgressMinutes"
                        [noParenthesisValue]="true"
                    ></app-input>
            
                    <app-input
                        type="range"
                        min="60"
                        max="240"
                        step="5"
                        name="weeklyProgressMinutes"
                        [label]="'Цель на неделю: ' + weeklyProgressMinutes.value + ' мин'"
                        [ngControl]="weeklyProgressMinutes"
                        [noParenthesisValue]="true"
                    ></app-input>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header py-2 small">Тренировка дня</div>
            <div class="card-body">
                <div class="d-grid" style="gap: 0.75rem;">
                    <app-input type="range" min="10" max="90" step="5" name="planMinutes"
                        [label]="'Длительность: ' + planMinutes.value + ' мин'" [ngControl]="planMinutes" [noParenthesisValue]="true"></app-input>
                    <app-input *ngFor="let k of PLAN_SEGMENTS" type="range" min="0" max="100" step="5" [name]="'plan-' + k"
                        [label]="PLAN_LABELS[k] + ': ' + planShares[k].value + '%'" [ngControl]="planShares[k]" [noParenthesisValue]="true"></app-input>
                    <p class="text-muted small mb-0">Доли пересчитываются пропорционально; по умолчанию 50 / 25 / 15 / 10.</p>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header py-2 small">Тренировка</div>
            <div class="card-body">
                <div class="d-grid" style="gap: 1rem;">
                    <app-input type="select" name="format" label="Формат ответа" placeholder="Формат ответа" [ngControl]="format" [options]="formatChoices" />
                    <app-input
                        type="range" min="70" max="85" step="5" name="targetAccuracy"
                        [label]="'Целевая точность: ' + targetAccuracy.value + '%'"
                        helper="Сложность подстраивается так, чтобы доля верных ответов держалась около этого значения (для двух вариантов +5%, для выбора из списка −5%)"
                        [ngControl]="targetAccuracy" [noParenthesisValue]="true"
                    ></app-input>
                    <app-input type="select" name="step" label="Шаг уровня после первых 15 заданий" placeholder="Шаг" [ngControl]="step" [options]="stepChoices" />
                    <app-input type="select" name="explanation" label="Разбор после ответа" placeholder="Разбор" [ngControl]="explanation" [options]="explanationChoices" />
                    <app-input type="select" name="namePool" label="Имена участников" placeholder="Имена" [ngControl]="namePool" [options]="poolChoices" />
                    <app-input type="select" name="nameMode" label="Подбор имён" placeholder="Подбор имён" [ngControl]="nameMode" [options]="nameModeChoices" />
                    <app-input type="checkbox" name="negations" label="Инверсии (красные слова)" [ngControl]="negations"></app-input>
                    <app-input type="checkbox" name="metas" label="Мета-отношения" [ngControl]="metas"></app-input>
                </div>
            </div>
        </div>
    </div>

    <div footer class="playcard-toolbar">
        <button
            class="btn btn-outline-primary"
            (click)="router.navigate([EnumScreens.Start])"
        >
            <i class="bi bi-arrow-left"></i> Главная
        </button>
        <div>
            <button
                class="btn btn-primary"
                (click)="game.playArcadeMode()"
            >
                Играть <i class="bi bi-play-fill"></i>
            </button>
        </div>
    </div>
</app-card>
