<div class="mb-2 text-muted">Режим показа</div>

<div class="game-mode-choices">
    <div class="game-mode-choice">
        <input type="radio" id="mode-choice-0" name="mode-kind" (click)="setMode('0')">
        <label for="mode-choice-0" ngbTooltip="Все посылки видны одновременно">Все посылки</label>
    </div>

    <div class="game-mode-choice">
        <input type="radio" id="mode-choice-1" name="mode-kind" (click)="setMode('1')">
        <label for="mode-choice-1" ngbTooltip="Посылки показываются по одной">По одной</label>
    </div>

    <div class="game-mode-choice">
        <input type="radio" id="mode-choice-2" name="mode-kind" (click)="setMode('2')">
        <label for="mode-choice-2" ngbTooltip="Посылки показываются по одной без возврата">По одной без возврата</label>
    </div>
</div>

<div class="mt-3 mb-2 text-muted">Другие настройки</div>

<div class="d-grid" style="gap: 1rem; padding-inline: 0.5rem;">
    <app-input
        type="select"
        name="syllogismGenerator"
        label="Генератор силлогизмов"
        placeholder="Генератор силлогизмов"
        [ngControl]="syllogismGenerator"
        [options]="syllogismGeneratorChoices"
    />
</div>
