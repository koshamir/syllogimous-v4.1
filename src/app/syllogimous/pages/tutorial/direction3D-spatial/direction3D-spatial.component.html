<h2>Направления 3D</h2>
<p>Та же карта плюс высота: «выше / ниже на k уровней», «на том же уровне».</p>
<ul>
    <li><span class="subject">WCA</span> на 1 строго севернее <span class="subject">BWA</span>, на том же уровне</li>
    <li><span class="subject">KLO</span> на 2 уровня выше <span class="subject">WCA</span>, в той же клетке на карте</li>
</ul>
<p><span class="subject">KLO</span> на 1 строго севернее и на 2 уровня выше <span class="subject">BWA</span> — <strong>Следует</strong>.</p>

<p class="small text-muted mb-0">Красное слово читай наоборот: <span class="is-negated">ниже</span> = выше.</p>
