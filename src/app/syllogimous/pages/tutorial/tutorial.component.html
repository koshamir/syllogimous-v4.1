<app-card>
    <div body class="py-3 px-md-3">
        <router-outlet class="d-none"></router-outlet>
        <div class="card mt-4">
            <div class="card-body small">
                <div><b>Следует</b> — вывод верен всегда, когда верны посылки.</div>
                <div><b>Противоречит</b> — вывод всегда неверен.</div>
                <div><b>Неизвестно</b> — может быть и так, и так.</div>
                <div class="mt-1">Лишних посылок нет: каждая нужна для ответа. Число посылок — это и есть сложность.</div>
                <div class="text-muted mt-1">Клавиши: 1 / 2 / 3 или ← / ↓ / →.</div>
            </div>
        </div>
    </div>

    <div *ngIf="!showBack; else showBackTemplate" footer class="playcard-toolbar">
        <div>
            <div class="form-check">
                <input #dontShowAnymore class="form-check-input" type="checkbox" value="" id="dontShowAnymore">
                <label class="form-check-label" for="dontShowAnymore">
                    Больше не показывать
                </label>
            </div>
        </div>
        <div>
            <button
                class="btn btn-primary"
                (click)="game.skipTutorial(dontShowAnymore.checked)"
            >Понятно, играть <i class="bi bi-play-fill"></i></button>
        </div>
    </div>
    <ng-template #showBackTemplate>
        <div footer class="playcard-toolbar">
            <div>
                <button
                    class="btn btn-outline-primary"
                    (click)="router.navigate([EnumScreens.Tutorials])"
                >
                    <i class="bi bi-arrow-left"></i> Уроки
                </button>
            </div>
        </div>
    </ng-template>
</app-card>
