<h2>Пространство и время</h2>
<p>Карта плюс время: «позже / раньше на k часов», «в то же время».</p>
<ul>
    <li><span class="subject">WCA</span> на 1 строго восточнее <span class="subject">BWA</span>, в то же время</li>
    <li><span class="subject">KLO</span> на 2 часа позже <span class="subject">WCA</span>, в той же клетке на карте</li>
</ul>
<p><span class="subject">KLO</span> позже <span class="subject">BWA</span> — <strong>Следует</strong>.</p>

<p class="small text-muted mb-0">Красное слово читай наоборот: <span class="is-negated">раньше</span> = позже.</p>
